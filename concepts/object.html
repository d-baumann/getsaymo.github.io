<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e5dc">
  <title>Saymo — The Object</title>
  <meta name="description" content="A quiet, tactile product website direction for Saymo.">
  <link rel="icon" href="../assets/images/app-icon.png">
  <link rel="stylesheet" href="new-directions.css">
  <script src="scripts.js" defer></script>
</head>
<body class="object-page">
  <a class="v2-skip" href="#main">Skip to content</a>
  <header class="concept-nav">
    <a class="v2-mark" href="index.html"><img src="../assets/images/app-icon.png" alt=""><span>saymo</span></a>
    <a class="concept-number" href="index.html">09 / 10</a>
    <a class="concept-cta" data-store="ios" href="#">Download</a>
  </header>

  <main id="main">
    <section class="object-hero">
      <p>German, every day.</p>
      <h1>Open.<br>Learn.<br><em>Close.</em></h1>
      <div class="object-stage" aria-label="Saymo app screen">
        <span class="object-ring object-ring--one"></span>
        <span class="object-ring object-ring--two"></span>
        <figure class="object-phone object-phone--back"><img data-shot="learn-hub" alt="Saymo learning modes"></figure>
        <figure class="object-phone object-phone--front"><img data-shot="home" alt="Saymo daily lesson"></figure>
        <span class="object-note object-note--one">10 min</span>
        <span class="object-note object-note--two">A1 → fluent</span>
      </div>
      <a class="object-button" data-store="ios" href="#">Make it a habit ↗</a>
    </section>

    <section class="object-tray" aria-label="Saymo modes">
      <figure><img data-shot="listen-chapters" alt="Listen"><figcaption>Listen</figcaption></figure>
      <figure><img data-shot="words-revealed" alt="Words"><figcaption>Words</figcaption></figure>
      <figure><img data-shot="articles" alt="Articles"><figcaption>Articles</figcaption></figure>
      <figure><img data-shot="cases" alt="Cases"><figcaption>Cases</figcaption></figure>
      <figure><img data-shot="endings" alt="Endings"><figcaption>Endings</figcaption></figure>
    </section>

    <section class="object-end">
      <h2>A small app<br>for a big language.</h2>
      <a data-store="ios" href="#">Try Saymo ↗</a>
    </section>
  </main>
</body>
</html>
