<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efede6">
  <title>Saymo — The Index</title>
  <meta name="description" content="A kinetic, all-modes website direction for Saymo.">
  <link rel="icon" href="../assets/images/app-icon.png">
  <link rel="stylesheet" href="new-directions.css">
  <script src="scripts.js" defer></script>
</head>
<body class="index-page">
  <a class="v2-skip" href="#main">Skip to content</a>
  <header class="concept-nav">
    <a class="v2-mark" href="index.html"><img src="../assets/images/app-icon.png" alt=""><span>saymo</span></a>
    <a class="concept-number" href="index.html">10 / 10</a>
    <a class="concept-cta" data-store="ios" href="#">Try Saymo</a>
  </header>

  <main id="main">
    <section class="index-hero">
      <div class="index-hero__copy">
        <span>All your German.</span>
        <h1>Everything<br><em>clicks.</em></h1>
        <a data-store="ios" href="#">Start now ↗</a>
      </div>
      <div class="index-wall" aria-label="Saymo feature mosaic">
        <figure class="index-tile index-tile--a"><img data-shot="dialogue-library" alt="Video dialogues"></figure>
        <figure class="index-tile index-tile--b"><img data-shot="words-revealed" alt="Words"></figure>
        <figure class="index-tile index-tile--c"><img data-shot="task-spelling" alt="Spelling"></figure>
        <figure class="index-tile index-tile--d"><img data-shot="listen-library" alt="Listen"></figure>
        <figure class="index-tile index-tile--e"><img data-shot="cases" alt="Cases"></figure>
        <figure class="index-tile index-tile--f"><img data-shot="revision" alt="Revision"></figure>
      </div>
    </section>

    <section class="index-ticker" aria-label="Learning modes">
      <span>LISTEN</span><span>WORDS</span><span>SENTENCES</span><span>ARTICLES</span>
      <span>CASES</span><span>ENDINGS</span><span>REVISE</span>
    </section>

    <section class="index-punch">
      <figure><img data-shot="task-word-order" alt="Saymo dialogue exercise"></figure>
      <div>
        <span>One tap away.</span>
        <h2>Your next<br>German win.</h2>
        <a data-store="ios" href="#">Get the app ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
