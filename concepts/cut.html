<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141412">
  <title>Saymo — The Cut</title>
  <meta name="description" content="A cinematic, scene-first website direction for Saymo.">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="new-directions.css">
  <script src="scripts.js" defer></script>
</head>
<body class="cut-page">
  <a class="v2-skip" href="#main">Skip to content</a>
  <header class="concept-nav concept-nav--light">
    <a class="v2-mark" href="index.html"><img src="../assets/images/app-icon.png" alt=""><span>saymo</span></a>
    <a class="concept-number" href="index.html">06 / 10</a>
    <a class="concept-cta concept-cta--light" data-store="ios" href="#">Get Saymo</a>
  </header>

  <main id="main">
    <section class="cut-hero" data-bg-shot="task-mcq">
      <div class="cut-hero__veil"></div>
      <div class="cut-hero__copy">
        <span>German in scene.</span>
        <h1>Live<br>the line.</h1>
        <a class="cut-play" href="#scenes"><span>▶</span> See how</a>
      </div>
      <div class="cut-phone">
        <img data-shot="task-word-order" alt="Saymo dialogue word order exercise">
      </div>
      <p class="cut-caption">Watch · choose · answer</p>
    </section>

    <section class="cut-strip" id="scenes" aria-label="Dialogue scenes">
      <figure><img data-shot="task-mcq" alt="Multiple choice dialogue task"></figure>
      <figure><img data-shot="task-spelling" alt="Spelling dialogue task"></figure>
      <figure><img data-shot="task-article" alt="Article dialogue task"></figure>
      <figure><img data-shot="task-preposition" alt="Preposition dialogue task"></figure>
      <figure><img data-shot="task-mcq-complete" alt="Completed dialogue task"></figure>
    </section>

    <section class="cut-end">
      <p>You don’t rehearse<br>real life.</p>
      <a class="cut-download" data-store="ios" href="#">Start a scene <span>↗</span></a>
    </section>
  </main>
</body>
</html>
