<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>Saymo — The Reel</title>
  <meta name="description" content="A character-led cinematic website direction for Saymo.">
  <link rel="icon" href="../assets/images/app-icon.png">
  <link rel="stylesheet" href="new-directions.css">
  <script src="scripts.js" defer></script>
</head>
<body class="reel-page">
  <a class="v2-skip" href="#main">Skip to content</a>
  <header class="concept-nav concept-nav--light">
    <a class="v2-mark" href="index.html"><img src="../assets/images/app-icon.png" alt=""><span>saymo</span></a>
    <a class="concept-number" href="index.html">08 / 10</a>
    <a class="concept-cta concept-cta--light" data-store="ios" href="#">Get the app</a>
  </header>

  <main id="main">
    <section class="reel-hero">
      <div class="reel-frame reel-frame--left"><img data-shot="dialogue-library" alt=""></div>
      <div class="reel-frame reel-frame--center"><img data-shot="dialogue-library-later" alt=""></div>
      <div class="reel-frame reel-frame--right"><img data-shot="dialogue-food" alt=""></div>
      <div class="reel-title">
        <span>Choose your scene.</span>
        <h1>Pick<br>a story.</h1>
        <a data-store="ios" href="#">Enter Saymo ↗</a>
      </div>
    </section>

    <section class="reel-lineup" aria-label="Dialogue situations">
      <span>THE BAKERY</span>
      <span>THE HOTEL</span>
      <span>THE POST OFFICE</span>
      <span>THE JOURNEY</span>
      <span>THE CAFÉ</span>
    </section>

    <section class="reel-action">
      <div class="reel-action__copy">
        <span>Then</span>
        <h2>speak.</h2>
      </div>
      <div class="reel-action__phones">
        <figure><img data-shot="task-spelling" alt="Dialogue spelling task"></figure>
        <figure><img data-shot="task-word-order" alt="Dialogue word order task"></figure>
        <figure><img data-shot="task-mcq-complete" alt="Completed dialogue task"></figure>
      </div>
    </section>

    <section class="reel-end">
      <span>Your next line is waiting.</span>
      <a data-store="ios" href="#">Play it ↗</a>
    </section>
  </main>
</body>
</html>
